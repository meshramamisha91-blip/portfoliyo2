<style>

/* CONTACT PAGE DESIGN */

.contact-container{

display:flex;

justify-content:center;

align-items:center;

min-height:80vh;

}

.contact-card{

width:500px;

padding:40px;

border-radius:20px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,0.2);

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,0.4);

}

.contact-card h1{

margin-bottom:30px;

font-size:32px;

}

.contact-info{

margin-bottom:25px;

font-size:18px;

line-height:35px;

}

.contact-info a{

color:#00e0ff;

text-decoration:none;

}

.contact-form input,

.contact-form textarea{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:10px;

background:rgba(255,255,255,0.1);

color:white;

}

.contact-form button{

margin-top:15px;

padding:12px 25px;

border:none;

border-radius:25px;

background:linear-gradient(45deg,#00e0ff,#22c55e);

color:white;

font-weight:bold;

cursor:pointer;

}

</style>
