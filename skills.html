.skill{

.bar{

width:100%;

height:10px;

background:rgba(255,255,255,0.2);

border-radius:20px;

overflow:hidden;

}

.fill{

height:100%;

background:linear-gradient(45deg,#00e0ff,#22c55e);

}

/* DIFFERENT SKILLS */

.python{width:75%}
.sql{width:70%}
.excel{width:85%}
.powerbi{width:65%}
.pandas{width:70%}
.visual{width:60%}


/* TOOLS SECTION */

.tools{

margin-top:70px;

}

.tools-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(150px,1fr));

gap:20px;

margin-top:25px;

}

.tool{

background:rgba(255,255,255,0.08);

padding:25px;

border-radius:15px;

text-align:center;

border:1px solid rgba(255,255,255,0.15);

transition:.3s;

}

.tool:hover{

transform:translateY(-8px);

background:rgba(255,255,255,0.15);

}

</style>
