<!DOCTYPE html>

<head>

<title>Projects | Amisha</title>

<link rel="stylesheet" href="style.css">

<style>

.projects-container{

padding:80px 10%;

}

.projects-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:30px;

margin-top:40px;

}

.project-card{

background:rgba(255,255,255,0.08);

border-radius:18px;

overflow:hidden;

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,0.15);

transition:.4s;

}

.project-card:hover{

transform:translateY(-12px) scale(1.03);

box-shadow:0 20px 40px rgba(0,0,0,0.6);

}
.project-card img{

width:100%;

height:180px;

object-fit:cover;

}

.project-content{

padding:20px;

}

.project-buttons a{

padding:8px 16px;

border-radius:20px;

text-decoration:none;

margin-right:10px;

color:white;

background:linear-gradient(45deg,#00e0ff,#22c55e);

}

</style>

</head>
